version: '3.8'

services:
  db:
    image: mariadb:11.8
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: nextcloud
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
    volumes:
      - nextcloud-db-data:/var/lib/mysql

  redis:
    image: redis
    container_name: nextcloud-redis
    restart: unless-stopped
    volumes:
      - nextcloud-redis-data:/data

  app:
    image: nextcloud
    container_name: nextcloud-app
    restart: unless-stopped


    ports:
      - "1234:80" # Nextcloud Web-UI erreichbar über Port 1234
    depends_on:
      - db
      - redis
    environment:
      MYSQL_PASSWORD: nextcloud
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_HOST: db
      REDIS_HOST: redis
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.julianw.de,webdav.julianw.de,dav.julianw.de
    volumes:

      - /etc/nextcloud:/var/www/html/config:ro
      - /media-10tb/storage/nextcloud_data:/media/storage/nextcloud_data
      # Optional, falls du eigene Apps hast:
      #- nextcloud-app-data:/var/www/html/custom_apps

      
      - /etc/nextcloud:/var/www/html/config
      - /media/storage/nextcloud_data:/var/www/html/data
      - nextcloud-app-data:/var/www/html

volumes:
  nextcloud-db-data:
  nextcloud-redis-data:
  nextcloud-app-data:
