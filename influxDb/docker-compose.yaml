services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8087:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: 1941011@@@
      DOCKER_INFLUXDB_INIT_ORG: wg
      DOCKER_INFLUXDB_INIT_BUCKET: homeassistant
      DOCKER_INFLUXDB_INIT_RETENTION: 104w        # 2 Jahre, "0s" = unendlich
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: 2sJITWRloHYyA2YcD4V6VOEGn5Bl0E9HsFwT0g5Nnlg7MIa4UEh9aITveQWcFwO
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
volumes:
  influxdb-data:
  influxdb-config:
