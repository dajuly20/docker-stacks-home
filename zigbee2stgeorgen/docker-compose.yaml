services:
  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:latest
    container_name: zigbee2stgeorgen
    restart: unless-stopped
    ports:
      - "8086:8080"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Europe/Berlin
      - ZIGBEE2MQTT_SERIAL_PORT=tcp://192.168.178.60:6638
      - ZIGBEE2MQTT_SERIAL_ADAPTER=ember
